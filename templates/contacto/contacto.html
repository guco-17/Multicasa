{% extends 'base.html' %}

{% block title %}Contacto | Multicasa{% endblock %}

{% block content %}
<section class="form-panel">
    <h1>Formulario de contacto</h1>
    {% if request.GET.success %}
        <p class="success-message">Tu mensaje se ha enviado correctamente.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar</button>
    </form>
</section>
{% endblock %}
